name: Secret scan (Issues)

# Issue・PR の題と本文、コメント、PR のレビューコメントに、認証に使える値（device code、承認 URL、トークン、鍵、
# アカウント ID など）が無いか、週に 1 回検査する（PBI #661、docs/design/secret-guard.md）。
# 当たりがあれば失敗する。出力は場所と種類で、値は出ない。毎日の検査はデーモンの予定（#775）が全リポジトリに同じコマンドを
# 回し、これはホストの外の予備。Actions が動かないときの手の実行は docs/design/github-operations.md。
on:
  schedule:
    - cron: "17 21 * * 0" # 月曜 06:17 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bash scripts/setup/scan_issues.sh "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
