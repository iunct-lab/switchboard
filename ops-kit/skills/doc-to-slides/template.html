<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{題}}</title>
<style>
:root{
  --surface:#fcfcfb; --surface-2:#f1f0ec; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8882;
  --line:#e2e0da; --accent:#2a78d6; --accent-soft:#e3eefb; --series-1:#2a78d6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c1c1b;color:var(--ink);
  font-family:"Inter","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-feature-settings:"palt";}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#deck{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--surface);padding:64px 84px 56px;display:none;flex-direction:column;}
.slide.active{display:flex}
.slide h1{font-size:54px;line-height:1.25;margin:0 0 20px;font-weight:700;letter-spacing:-.01em}
.slide h2{font-size:38px;line-height:1.3;margin:0 0 28px;font-weight:700;letter-spacing:-.01em}
.slide h2 small{display:block;font-size:18px;color:var(--ink-3);font-weight:500;margin-top:6px;letter-spacing:0}
.slide p{font-size:24px;line-height:1.65;margin:0 0 14px}
.slide ul{font-size:24px;line-height:1.6;margin:0;padding-left:1.2em}
.slide li{margin:0 0 10px}
.slide li ul{font-size:20px;margin-top:6px;color:var(--ink-2)}
.slide li ul li{margin-bottom:2px}
.lead{font-size:28px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:18px;color:var(--ink-2);line-height:1.6}
.tag{display:inline-block;align-self:flex-start;font-size:15px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 10px;margin-bottom:14px;letter-spacing:.02em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;min-height:0}
.cols.wide{grid-template-columns:1.3fr 1fr}
.cols.narrow{grid-template-columns:1fr 1.3fr}
.col{min-width:0}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.shot img{display:block;width:100%;height:auto}
.shot.tall{display:flex;justify-content:center;align-items:flex-start;max-height:500px}
.shot.tall img{width:auto;max-height:500px}
.cap{font-size:15px;color:var(--ink-3);margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:20px;line-height:1.45}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:16px;letter-spacing:.02em;border-bottom:2px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table.compact{font-size:18px}
table.compact th,table.compact td{padding:7px 10px}
table.tight th,table.tight td{padding:4px 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:6px 0 26px}
.kpi{background:var(--surface-2);border-radius:12px;padding:18px 22px}
.kpi .l{font-size:15px;color:var(--ink-2);margin-bottom:4px}
.kpi .v{font-size:40px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:14px;color:var(--ink-3);margin-top:6px}
.flow{display:flex;align-items:stretch;gap:10px;margin:10px 0 26px;flex-wrap:wrap}
.flow .step{flex:1;min-width:120px;background:var(--surface-2);border-radius:10px;padding:14px 12px;text-align:center;font-size:19px;font-weight:600;position:relative;line-height:1.3}
.flow .step em{display:block;font-style:normal;font-weight:500;font-size:14px;color:var(--ink-2);margin-top:6px}
.card{background:var(--surface-2);border-radius:12px;padding:20px 24px}
.card h3{margin:0 0 10px;font-size:22px;font-weight:650}
.card p,.card ul{font-size:19px;line-height:1.55}
.card li{margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.num-big{font-size:56px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.foot{position:absolute;left:84px;right:84px;bottom:22px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.title .foot{color:rgba(255,255,255,.5)}
.slide.title{background:#17322e;color:#f4f3ee;justify-content:center}
.slide.title h1{font-size:68px;color:#fff;margin-bottom:10px}
.slide.title .sub{font-size:30px;color:#cfe0da;margin-bottom:40px}
.slide.title .meta{font-size:20px;color:#9fbcb3}
.slide.section{background:#17322e;color:#f4f3ee;justify-content:center}
.slide.section h2{font-size:52px;color:#fff}
.slide.section p{color:#cfe0da;font-size:26px}
.slide.section .tag{background:rgba(255,255,255,.12);color:#cfe0da}
.quote{border-left:4px solid var(--accent);padding:4px 20px;color:var(--ink-2);font-size:22px;margin:10px 0 20px;line-height:1.6}
.callout{background:var(--accent-soft);border-radius:12px;padding:18px 24px;font-size:22px;line-height:1.55;margin-top:auto}
.callout b{color:var(--accent)}
.bar-row{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:14px;font-size:19px;margin-bottom:12px}
.bar-row .track{height:18px;background:var(--surface-2);border-radius:4px;position:relative}
.bar-row .fill{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.links li{margin-bottom:16px}
.links .u{display:block;font-size:17px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px}
/* ui */
#hud{position:fixed;right:16px;bottom:12px;font-size:12px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;z-index:5;font-family:ui-monospace,monospace}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;z-index:5;transition:width .2s}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#111;color:#eee;padding:16px 28px;font-size:15px;line-height:1.6;display:none;z-index:6;border-top:1px solid #333}
#notes.on{display:block}
#notes .t{color:#9fbcb3;font-size:12px;margin-bottom:6px;font-family:ui-monospace,monospace}
#help{position:fixed;left:16px;top:10px;transition:opacity 1s;font-size:12px;color:rgba(255,255,255,.45);z-index:5}
/* read mode: vertical reflow for phones */
#mode{position:fixed;right:12px;top:10px;z-index:7;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-family:inherit;cursor:pointer}
body.read #mode{border-color:var(--line);background:#fff;color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,.08)}
body.read{overflow:auto;background:var(--surface);height:auto}
body.read #stage{position:static;display:block;overflow:visible}
body.read #deck{width:100%;height:auto;transform:none!important;margin:0!important}
body.read .slide{position:relative;display:flex;height:auto;min-height:0;padding:30px 20px 22px;border-bottom:1px solid var(--line)}
body.read .slide.title,body.read .slide.section{padding:56px 20px 44px}
body.read .slide h1{font-size:34px;margin-bottom:10px}
body.read .slide.title h1{font-size:40px}
body.read .slide.title .sub{font-size:20px;margin-bottom:18px}
body.read .slide.title .meta{font-size:15px}
body.read .slide.section h2{font-size:28px}
body.read .slide.section p{font-size:16px}
body.read .slide h2{font-size:24px;margin-bottom:16px}
body.read .slide h2 small{font-size:13px}
body.read .slide p,body.read .slide ul{font-size:16px!important;line-height:1.6}
body.read .slide li{margin-bottom:6px}
body.read .slide li ul{font-size:14px}
body.read .lead{font-size:18px}
body.read .small{font-size:13px!important}
body.read .tag{font-size:12px;margin-bottom:10px}
body.read .quote{font-size:15px!important;padding:2px 14px}
body.read .cols,body.read .cols.wide,body.read .cols.narrow,body.read .grid3,body.read .grid2{display:flex;flex-direction:column;gap:16px}
body.read .kpis{grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
body.read .kpi{padding:12px 14px}
body.read .kpi .v{font-size:26px!important;padding-top:0!important}
body.read .kpi .l{font-size:12px}
body.read .kpi .s{font-size:11px}
body.read .card{padding:14px 16px}
body.read .card h3{font-size:17px;margin-bottom:6px}
body.read .card p,body.read .card ul{font-size:14px!important}
body.read .num-big{font-size:34px!important}
body.read .flow{gap:8px;margin:6px 0 16px}
body.read .flow .step{min-width:calc(50% - 4px);font-size:15px;padding:10px 8px}
body.read .flow .step em{font-size:12px}
body.read table,body.read table.compact{font-size:13px!important;line-height:1.4}
body.read th,body.read td{padding:6px 8px!important;word-break:break-word}
body.read th{font-size:12px}
body.read .shot{box-shadow:none}
body.read .shot.tall{max-height:none;justify-content:flex-start}
body.read .shot.tall img{max-height:none;width:100%}
body.read .cap{font-size:12px}
body.read .callout{margin-top:14px;font-size:15px!important;padding:12px 14px}
body.read .bar-row{grid-template-columns:100px 1fr 44px;font-size:14px;gap:8px}
body.read .links li{margin-bottom:12px}
body.read .links .u{font-size:12px;word-break:break-all}
body.read .foot{position:static;margin-top:16px;font-size:11px;padding-top:8px}
body.read h3{font-size:17px!important}
body.read #hud,body.read #bar,body.read #help,body.read #notes{display:none!important}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:#fff;height:auto}
  #stage{position:static;display:block}
  #deck{width:1280px;height:auto;transform:none!important}
  .slide{position:relative;display:flex!important;height:720px;page-break-after:always;break-after:page}
  #hud,#bar,#notes,#help,#mode{display:none!important}
}
</style>
</head>
<body>
<div id="stage"><div id="deck">

<!-- 1 枚 = 1 section。data-notes は発表者メモ（先頭に【分:秒】の持ち時間の目安）。foot の右の空の span にはページ番号が入る -->
<section class="slide title" data-notes="【0:30】{{メモ}}">
  <h1>{{題}}</h1>
  <div class="sub">{{副題}}</div>
  <div class="meta">{{扱う資料}}</div>
</section>

<section class="slide" data-notes="【1:00】{{メモ}}">
  <div class="tag">{{章}}</div>
  <h2>{{見出し}}</h2>
  <div class="grid3">
    <div class="card"><h3>{{論点 1}}</h3><p>{{資料の文}}</p></div>
    <div class="card"><h3>{{論点 2}}</h3><p>{{資料の文}}</p></div>
    <div class="card"><h3>{{論点 3}}</h3><p>{{資料の文}}</p></div>
  </div>
  <div class="foot"><span>{{章}}</span><span></span></div>
</section>

<section class="slide section" data-notes="【0:20】{{メモ}}">
  <div class="tag">{{章}}</div>
  <h2>{{章の題}}</h2>
  <p>{{1 行}}</p>
</section>

<section class="slide" data-notes="【1:30】{{メモ}}">
  <div class="tag">{{章}}</div>
  <h2>{{見出し}}<small>{{補足}}</small></h2>
  <div class="cols">
    <div class="col"><ul><li>{{要点}}</li><li>{{要点}}</li></ul></div>
    <div class="col"><div class="shot"><img src="data:image/png;base64,{{画像}}" alt="{{説明}}"></div><div class="cap">{{出典}}</div></div>
  </div>
  <div class="foot"><span>{{章}}</span><span></span></div>
</section>

<section class="slide" data-notes="【0:30】{{メモ}}">
  <div class="tag">資料</div>
  <h2>{{見出し}}</h2>
  <ul class="links"><li>{{資料の題}}<span class="u">{{URL}}</span></li></ul>
  <div class="foot"><span>資料</span><span></span></div>
</section>

</div></div>
<button id="mode" type="button">縦読み</button>
<div id="bar"></div>
<div id="hud"></div>
<div id="help">← → / Space: 進む · N: メモ · F: 全画面</div>
<div id="notes"><div class="t">SPEAKER NOTES</div><div id="notes-body"></div></div>

<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  slides.forEach((s,k)=>{s.id='s'+(k+1);const f=s.querySelector('.foot span:last-child');if(f&&!f.textContent)f.textContent=String(k+1);});
  const deck=document.getElementById('deck');
  const hud=document.getElementById('hud');
  const bar=document.getElementById('bar');
  const notes=document.getElementById('notes');
  const notesBody=document.getElementById('notes-body');
  let i=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1),10)||1)-1));
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((s,k)=>s.classList.toggle('active',k===i));
    hud.textContent=(i+1)+' / '+slides.length;
    bar.style.width=((i+1)/slides.length*100)+'%';
    notesBody.textContent=slides[i].dataset.notes||'';
    history.replaceState(null,'','#'+(i+1));
  }
  const modeBtn=document.getElementById('mode');
  function setRead(on){
    document.body.classList.toggle('read',on);
    modeBtn.textContent=on?'スライド表示':'縦読み';
    if(on){slides.forEach(s=>s.classList.add('active'));requestAnimationFrame(()=>slides[i].scrollIntoView());}
    else{show(i);fit();scrollTo(0,0);}
  }
  modeBtn.addEventListener('click',()=>setRead(!document.body.classList.contains('read')));
  function fit(){
    if(document.body.classList.contains('read'))return;
    const vv=window.visualViewport;
    const w=vv?vv.width:innerWidth,h=(vv?vv.height:innerHeight)-(notes.classList.contains('on')?notes.offsetHeight:0);
    const s=Math.min(w/1280,h/720);
    deck.style.transform='scale('+s+')';
    deck.style.marginBottom=(notes.classList.contains('on')?notes.offsetHeight:0)+'px';
  }
  addEventListener('keydown',e=>{
    if(document.body.classList.contains('read')||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();show(i+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();show(i-1);}
    else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
    else if(e.key==='n'||e.key==='N'){notes.classList.toggle('on');fit();}
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
  });
  deck.addEventListener('click',e=>{if(e.target.closest('a')||document.body.classList.contains('read'))return;const r=deck.getBoundingClientRect();(e.clientX-r.left)/r.width>0.3?show(i+1):show(i-1);});
  let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',e=>{if(tx==null||document.body.classList.contains('read'))return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)show(dx<0?i+1:i-1);tx=null;});
  addEventListener('resize',fit);
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  show(i);fit();
  (function(){
    const q=new URLSearchParams(location.search);
    let want=null;
    if(q.has('read'))want=q.get('read')!=='0';
    else{
      const coarse=matchMedia('(pointer:coarse)').matches;
      want=innerWidth<700||(coarse&&innerHeight>innerWidth);
    }
    if(want)setRead(true);
  })();
  // printing from the reading mode still prints one 1280x720 slide per page
  let readBeforePrint=false;
  addEventListener('beforeprint',()=>{readBeforePrint=document.body.classList.contains('read');if(readBeforePrint)document.body.classList.remove('read');});
  addEventListener('afterprint',()=>{if(readBeforePrint)document.body.classList.add('read');});
  setTimeout(()=>{document.getElementById('help').style.opacity='0';},6000);
})();
</script>
</body>
</html>
